<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华夏共和国 - 欢迎页面</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #C8102E;
            --primary-dark: #9B0C23;
            --accent-color: #ffae00;
            --text-color: #2C3E50;
            --text-light: #5A6C7D;
            --light-bg: #F8F9FA;
            --white: #fffdfd;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-hover: 0 8px 24px rgba(0,0,0,0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --border-radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
            line-height: 1.7;
            color: var(--text-color);
            background-color: var(--light-bg);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .welcome-container {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .welcome-icon {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        .welcome-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .welcome-subtitle {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .reading-timer {
            background: var(--light-bg);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            margin: 2rem 0;
            border: 2px dashed var(--primary-color);
        }

        .timer-text {
            font-size: 1rem;
            color: var(--text-color);
            margin-bottom: 1rem;
        }

        .timer-display {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            width: 0%;
            transition: width 0.3s ease;
        }

        .btn {
            display: inline-block;
            background: var(--primary-color);
            color: #FFFFFF;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: var(--border-radius);
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            transition: var(--transition);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(200, 16, 46, 0.3);
            opacity: 0.5;
            pointer-events: none;
        }

        .btn.active {
            opacity: 1;
            pointer-events: auto;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(200, 16, 46, 0.4);
        }

        .time-info {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 1rem;
        }

        .current-time {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: 1rem;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="welcome-icon">
            <i class="fas fa-landmark"></i>
        </div>
        <h1 class="welcome-title">华夏共和国</h1>
        <p class="welcome-subtitle">
            欢迎来到华夏共和国官方网站。为了确保您充分了解我们的内容，
            请仔细阅读以下信息，阅读完成后即可进入主页面。
        </p>
        
        <div class="reading-timer">
            <p class="timer-text">请阅读以下内容至少3秒钟：</p>
            <div class="timer-display" id="timer">3秒</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            <p class="timer-text">华夏共和国是一个基于OpenGeofiction平台的虚拟国家项目，
            致力于构建一个完整、丰富的虚拟世界。我们欢迎所有对地图绘制、
            世界构建和创意写作感兴趣的参与者加入我们的社区。</p>
        </div>

        <button class="btn" id="enter-btn" onclick="enterMainPage()">
            进入主页面 <i class="fas fa-arrow-right"></i>
        </button>

        <div class="time-info">
            <i class="fas fa-clock"></i> 阅读计时器：确保您已充分了解内容
        </div>

        <div class="current-time" id="current-time"></div>
    </div>

    <script>
        // 设置系统时间为东京时间
        function updateTokyoTime() {
            const now = new Date();
            const tokyoTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Tokyo"}));
            const timeString = tokyoTime.toLocaleString('zh-CN', {
                timeZone: 'Asia/Tokyo',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            document.getElementById('current-time').textContent = `东京时间: ${timeString}`;
        }

        // 更新东京时间
        updateTokyoTime();
        setInterval(updateTokyoTime, 1000);

        // 阅读计时器
        let timeRemaining = 3; // 3秒
        let timerInterval;
        const timerElement = document.getElementById('timer');
        const progressElement = document.getElementById('progress');
        const enterBtn = document.getElementById('enter-btn');

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                const progressPercentage = ((3 - timeRemaining) / 3) * 100;
                
                timerElement.textContent = `${timeRemaining}秒`;
                progressElement.style.width = `${progressPercentage}%`;

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    timerElement.textContent = "完成！";
                    timerElement.style.color = "#10B981";
                    enterBtn.classList.add('active');
                }
            }, 1000);
        }

        // 页面加载后开始计时
        window.addEventListener('load', startTimer);

        // 进入主页面
        function enterMainPage() {
            if (timeRemaining <= 0) {
                window.location.href = 'main.html';
            }
        }

        // 防止用户通过刷新页面绕过计时器
        window.addEventListener('beforeunload', function(e) {
            if (timeRemaining > 0) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
</body>
</html>
